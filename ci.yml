name: CI — Agentic Log Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ─── Lint & Test ─────────────────────────────────────────────────────────
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: |
          pip install pytest pytest-asyncio httpx pyyaml
          # Install agent deps without heavy ML models for CI speed
          pip install fastapi uvicorn qdrant-client pydantic python-dotenv

      - name: Run unit tests (no external services)
        run: pytest tests/ -v --ignore=tests/test_integration.py -k "not qdrant and not ollama and not docker"

      - name: Validate JSON configs
        run: |
          python -c "import json; json.load(open('n8n/workflow.json')); print('✅ n8n workflow valid')"
          python -c "import json; json.load(open('nifi/flow_template.json')); print('✅ NiFi template valid')"

      - name: Validate docker-compose syntax
        run: |
          pip install pyyaml
          python -c "import yaml; yaml.safe_load(open('docker-compose.yml')); print('✅ docker-compose.yml valid')"

  # ─── Docker Build ─────────────────────────────────────────────────────────
  build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build agents image
        uses: docker/build-push-action@v5
        with:
          context: ./agents
          push: false
          tags: agentic-pipeline/agents:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build dashboard image
        uses: docker/build-push-action@v5
        with:
          context: ./dashboard
          push: false
          tags: agentic-pipeline/dashboard:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build bootstrap image
        uses: docker/build-push-action@v5
        with:
          context: ./scripts
          push: false
          tags: agentic-pipeline/bootstrap:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Security Scan ────────────────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner (agents)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: ./agents
          format: table
          exit-code: 0          # warn only, don't fail
          severity: CRITICAL,HIGH

  # ─── Notify on failure ────────────────────────────────────────────────────
  notify:
    name: Notify on failure
    runs-on: ubuntu-latest
    needs: [test, build]
    if: failure()

    steps:
      - name: Pipeline failed
        run: |
          echo "::error::CI pipeline failed. Check test and build jobs."
          exit 1
